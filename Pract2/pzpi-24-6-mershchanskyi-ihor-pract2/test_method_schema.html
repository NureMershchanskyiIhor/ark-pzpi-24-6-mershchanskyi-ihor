
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Порівняння потоків виконання</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #eef2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    padding: 25px;
}

.diagram-wrapper {
    width: 100%;
    max-width: 1400px;
    background: #fff;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 8px 30px #00000015;
}

svg {
    display: block;
    width: 100%;
    height: auto;
}

text {
    font-family: Arial, sans-serif;
    fill: #111;
}

.main-title {
    font-size: 27px;
    font-weight: bold;
}

.section-title {
    font-size: 16px;
    font-weight: bold;
}

.section-subtitle {
    font-size: 13px;
    fill: #444;
}

.node {
    stroke: #111;
    stroke-width: 1.2;
}

.blue { fill: #d6e8f1; }
.green { fill: #83c58e; }
.gray { fill: #d8d8d8; }
.light { fill: #e5f2f1; }

.node-text {
    font-size: 11px;
    text-anchor: middle;
}

.node-bold {
    font-size: 11px;
    font-weight: bold;
    text-anchor: middle;
}

.arrow {
    fill: none;
    stroke: #111;
    stroke-width: 1.5;
    marker-end: url(#arrow);
}

.terminal {
    fill: #ccebd4;
    stroke: #438b56;
    stroke-width: 2;
}

.terminal-error {
    fill: #e65c55;
    stroke: #b83232;
    stroke-width: 2;
}

.label {
    font-size: 10px;
    fill: #333;
}

.end-text {
    fill: white;
    font-size: 12px;
    font-weight: bold;
    text-anchor: middle;
}
</style>
</head>

<body>

<div class="diagram-wrapper">

<svg viewBox="0 0 1200 340"
     xmlns="http://www.w3.org/2000/svg">

<defs>
    <marker id="arrow" markerWidth="8" markerHeight="8"
        refX="7" refY="3" orient="auto">
        <path d="M0,0 L0,6 L7,3 Z" fill="#111"/>
    </marker>
</defs>

<line x1="600" y1="55" x2="600" y2="315"
      stroke="#b9c5cc" stroke-width="1.5"/>

<rect x="20" y="100" width="95" height="40"
      rx="22" class="node blue"/>
<text x="67" y="123" class="node-bold">Запит даних</text>

<path d="M115 120 H138" class="arrow"/>

<rect x="137" y="94" width="126" height="52"
      rx="6" class="node green"/>
<text x="200" y="109" class="node-bold">ЗАХИСНА УМОВА:</text>
<text x="200" y="121" class="node-text">user_id not in</text>
<text x="200" y="133" class="node-text">permissions_db</text>

<path d="M200 146 V165" class="arrow"/>

<polygon points="200,165 242,193 200,221 158,193"
         class="node blue"/>
<text x="200" y="189" class="node-bold">USER ID</text>
<text x="200" y="201" class="node-bold">ВІДСУТНІЙ?</text>

<path d="M242 193 H345" class="arrow"/>
<text x="272" y="184" class="label">НІ</text>

<rect x="345" y="174" width="125" height="42"
      rx="5" class="node terminal"/>
<text x="407" y="195" class="node-text">permissions_db[user_id]</text>

<path d="M200 221 V242" class="arrow"/>
<text x="210" y="236" class="label">ТАК</text>

<rect x="130" y="242" width="135" height="54"
      rx="6" class="node gray"/>
<text x="198" y="267" class="node-bold">ОБРОБКА ВИНЯТКУ</text>
<text x="198" y="280" class="node-text">(UserNotFoundError)</text>

<path d="M265 269 H370" class="arrow"/>

<rect x="370" y="242" width="68" height="54"
      rx="4" class="node terminal-error"/>
<text x="404" y="260" class="end-text">FAILED</text>
<path d="M380 268 H428 M380 274 H428 M380 280 H428"
      stroke="#fff" stroke-width="2"/>

<rect x="615" y="100" width="95" height="40"
      rx="22" class="node blue"/>
<text x="662" y="123" class="node-bold">Запит даних</text>

<path d="M710 120 H733" class="arrow"/>

<rect x="732" y="94" width="126" height="52"
      rx="6" class="node green"/>
<text x="795" y="109" class="node-bold">ЗАХИСНА УМОВА:</text>
<text x="795" y="121" class="node-text">user_id not in</text>
<text x="795" y="133" class="node-text">permissions_db</text>

<path d="M795 146 V165" class="arrow"/>

<polygon points="795,165 837,193 795,221 753,193"
         class="node blue"/>
<text x="795" y="189" class="node-bold">USER ID</text>
<text x="795" y="201" class="node-bold">ВІДСУТНІЙ?</text>

<path d="M837 193 H891" class="arrow"/>
<text x="859" y="184" class="label">НІ</text>

<rect x="890" y="174" width="125" height="42"
      rx="5" class="node terminal"/>
<text x="952" y="195" class="node-text">permissions_db[user_id]</text>

<path d="M795 221 V242" class="arrow"/>
<text x="803" y="236" class="label">ТАК</text>

<rect x="745" y="242" width="100" height="54"
      rx="6" class="node light"/>
<text x="795" y="264" class="node-bold">Повертається</text>
<text x="795" y="278" class="node-text">пустий масив</text>

</svg>
</div>

</body>
</html>
